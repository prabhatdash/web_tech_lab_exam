<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary</title>
</head>
<body>

    <h2>Employee Salary Form</h2>

    <form action="salary.php" method="post">

        <label>Employee Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Basic Salary:</label>
        <input type="number" name="basic" required>
        <br><br>

        <label>HRA Percentage:</label>
        <input type="number" name="hra_percent" required>
        <br><br>

        <label>DA Percentage:</label>
        <input type="number" name="da_percent" required>
        <br><br>

        <input type="submit" value="Calculate Salary">

    </form>

</body>
</html>
