<!DOCTYPE html>
<head>
    <title>Student registration</title>
</head>
<body>
    <p>Soumilee Basak,PG/04/MCA/2025/021</p>
    <p>Welcome to the Student Registration Form</p>

    <h2>Registration Form</h2>
    <form action="process.php" method="POST">
        <label for="student_name">Student Name:</label>
        <input type="text" id="student_name" name="student_name">
        <br>
        <label for="roll_number">Roll Number:</label>
        <input type="text" id="roll_number" name="roll_number">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="department">Department:</label>
        <select id="department" name="department">
            <option value="">-- Select Department --</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="PHYSICS">PHYSICS</option>
            <option value="MCA">MCA</option>
            <option value="ENGLISH">ENGLISH</option>
        </select>
        <br>
        <label>Gender:</label>
        <input class="gender" type="radio" name="gender" value="Male" id="male">
        <label for="male">Male</label>
        <input class="gender" type="radio" name="gender" value="Female" id="female">
        <label for="female">Female</label>
        <br>
        <label>Year:</label>
        <select name="year">
            <option value="">select</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>
        <br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
