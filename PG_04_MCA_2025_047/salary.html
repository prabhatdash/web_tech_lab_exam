<!DOCTYPE html>
<html>
<head>
    <title>Employee Salary Calculator</title>
</head>
<body>

    <h2>Employee Salary Calculator</h2>

    <form action="salary.php" method="post">      

        <label>Employee Name:</label>
        <input type="text" name="employee_name" required>
        <br><br>

        <label>Basic Salary:</label>
        <input type="number" name="basic_salary" step="0.01" required>
        <br><br>

        <label>HRA Percentage:</label>
        <input type="number" name="hra" step="0.01" required>
        <br><br>

        <label>DA Percentage:</label>
        <input type="number" name="da" step="0.01" required>
        <br><br>

        <input type="submit" value="Calculate Salary">

    </form>

</body>
</html>
